name: Build OPPO R11s Kernel

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip wget git

    - name: Download Toolchain (Google NDK)
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
        unzip -q android-ndk-r23b-linux.zip
        echo "$PWD/android-ndk-r23b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        
        # 1. 生成 defconfig
        make O=out CC=clang sdm660_defconfig
        
        # 2. 编译内核 (-fcommon 解决 yylloc 报错, -Wno-error 防止旧警告中断编译)
        make O=out -j$(nproc) CC=clang KCFLAGS="-fcommon -Wno-error" Image.gz dtbs

    - name: Package AnyKernel
      run: |
        cp out/arch/arm64/boot/Image.gz AnyKernel/
        cd AnyKernel
        zip -r ../OPPO_R11s_RESUKISU_Kernel.zip *

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Zip
        path: OPPO_R11s_RESUKISU_Kernel.zip
