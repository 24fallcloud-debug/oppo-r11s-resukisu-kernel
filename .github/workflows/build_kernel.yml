name: Build OPPO R11s Kernel

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        # 直接让 Ubuntu 帮我们装交叉编译工具链，绝对不存在 404 找不到源的问题
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip wget git gcc-aarch64-linux-gnu

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        # 使用 Ubuntu 官方源安装的交叉编译器
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 注入全局参数，预防老内核的各类报错
        export HOSTCFLAGS="-fcommon -Wno-error"
        export KCFLAGS="-fcommon -Wno-error"
        
        make O=out sdm660_defconfig
        make O=out -j$(nproc) Image.gz dtbs

    - name: Package AnyKernel
      run: |
        cp out/arch/arm64/boot/Image.gz AnyKernel/
        cd AnyKernel
        zip -r ../OPPO_R11s_RESUKISU_Kernel.zip *

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Zip
        path: OPPO_R11s_RESUKISU_Kernel.zip
