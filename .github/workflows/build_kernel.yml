name: Build OPPO R11s Kernel

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip wget git

    - name: Download Toolchain (GCC 7.5)
      run: |
        # 使用国内镜像下载 Linaro GCC 7.5，避免 301 报错
        wget https://mirrors.tuna.tsinghua.edu.cn/armbian-releases/_toolchains/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
        tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
        echo "$PWD/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 全局注入 -fcommon 和 -Wno-error，解决 yylloc 报错
        export HOSTCFLAGS="-fcommon -Wno-error"
        export KCFLAGS="-fcommon -Wno-error"
        
        make O=out sdm660_defconfig
        make O=out -j$(nproc) Image.gz dtbs
